<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WTFIS / Pain Point</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --blue: #233df2;
        --blue-dark: #1326b9;
        --white: #f8f8f3;
        --line: rgba(248, 248, 243, 0.19);
        --acid: #ccff3d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--blue);
      }

      body {
        overflow-x: hidden;
        color: var(--white);
        cursor: none;
        font-family: "IBM Plex Mono", monospace;
      }

      button,
      a {
        color: inherit;
        font: inherit;
      }

      .cursor-orb {
        position: fixed;
        z-index: 20;
        width: 0.9rem;
        height: 0.9rem;
        border: 1px solid var(--acid);
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%);
        transition: width 180ms ease, height 180ms ease, background 180ms ease;
      }

      .cursor-orb.is-hovering {
        width: 3.4rem;
        height: 3.4rem;
        background: var(--acid);
        mix-blend-mode: difference;
      }

      .hero {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
        background-color: var(--blue);
        background-image:
          linear-gradient(to right, var(--line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--line) 1px, transparent 1px);
        background-size: clamp(4rem, 8vw, 8rem) clamp(4rem, 8vw, 8rem);
      }

      .hero::before {
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 0 52%, rgba(255, 255, 255, 0.05) 52% 52.15%, transparent 52.15%);
        content: "";
        pointer-events: none;
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(calc(100% - 2rem), 96rem);
        min-height: 100svh;
        margin: 0 auto;
        padding: 1rem 0 3rem;
      }

      .menu {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .menu-brand,
      .menu-item {
        display: inline-flex;
        align-items: center;
        min-height: 2.8rem;
        border: 1px solid rgba(248, 248, 243, 0.7);
        border-radius: 999px;
        padding: 0.7rem 1rem;
        background: rgba(19, 38, 185, 0.3);
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-transform: uppercase;
        transition: background 180ms ease, color 180ms ease, transform 180ms ease;
      }

      .menu-brand {
        border-color: var(--acid);
        background: var(--acid);
        color: var(--blue-dark);
        font-weight: 600;
      }

      .menu-links {
        display: flex;
        gap: 0.5rem;
      }

      .menu-item:hover,
      .menu-item:focus-visible {
        background: var(--white);
        color: var(--blue-dark);
        outline: none;
        transform: translateY(-2px);
      }

      .title-lockup {
        display: flex;
        flex-direction: column;
        gap: clamp(0.2rem, 0.8vw, 0.8rem);
        width: max-content;
        max-width: 100%;
        position: absolute;
        top: 50%;
        left: 50%;
        margin: 0;
        font-family: Inter, sans-serif;
        font-size: clamp(3.4rem, 10.5vw, 11.5rem);
        font-weight: 900;
        letter-spacing: -0.075em;
        line-height: 0.82;
        transform: translate(-50%, -50%);
      }

      .pain-pops {
        position: absolute;
        z-index: 3;
        inset: 0;
        pointer-events: none;
      }

      .pain-pop {
        position: absolute;
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        max-width: 15rem;
        border: 1px solid var(--blue-dark);
        border-radius: 1.15rem;
        padding: 0.65rem 0.85rem 0.65rem 0.65rem;
        background: var(--white);
        color: var(--blue-dark);
        font-size: clamp(0.58rem, 0.7vw, 0.7rem);
        letter-spacing: 0.03em;
        line-height: 1.25;
        opacity: 1;
        transform: none;
        transform-origin: center;
        box-shadow: 0 0.7rem 1.8rem rgba(11, 26, 130, 0.2);
      }

      .pain-pop::before {
        width: 0.55rem;
        height: 0.55rem;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--acid);
        content: "";
      }

      .pop-one {
        top: 28%;
        left: 2%;
      }

      .pop-two {
        top: 37%;
        right: 2%;
      }

      .pop-three {
        bottom: 27%;
        left: 4%;
      }

      .pop-four {
        right: 5%;
        bottom: 22%;
      }

      .dev-badge {
        position: absolute;
        right: 4%;
        bottom: 5%;
        z-index: 3;
        border: 1px solid var(--acid);
        border-radius: 999px;
        padding: 0.55rem 0.8rem;
        color: var(--acid);
        font-size: 0.6rem;
        letter-spacing: 0.12em;
        opacity: 1;
        text-transform: uppercase;
        transform: none;
      }

      .title-row {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(0.35rem, 1.5vw, 1.5rem);
        white-space: nowrap;
      }

      .word {
        position: relative;
        display: inline-block;
        color: var(--white);
        text-shadow: 0.045em 0.045em 0 var(--blue-dark);
        transform-origin: center;
        transition: color 180ms ease, text-shadow 180ms ease;
        will-change: transform;
      }

      .word:hover {
        color: var(--acid);
        text-shadow: 0.045em 0.045em 0 var(--blue-dark), 0 0 1.2rem rgba(204, 255, 61, 0.38);
      }

      .word::after {
        position: absolute;
        top: -0.38em;
        right: -0.16em;
        content: attr(data-emoji);
        font-family: sans-serif;
        font-size: 0.2em;
        opacity: 0;
        transform: translateY(0.7rem) rotate(-12deg) scale(0.4);
        transition: opacity 180ms ease, transform 220ms cubic-bezier(0.2, 1.6, 0.4, 1);
      }

      .word:hover::after {
        opacity: 1;
        transform: translateY(0) rotate(8deg) scale(1);
      }

      .media-slot {
        position: relative;
        display: inline-block;
        flex: 0 0 auto;
        width: 1.55em;
        height: 0.64em;
        overflow: hidden;
        border: 2px solid var(--white);
        border-radius: 1.2rem;
        background: var(--blue-dark);
        box-shadow: 0.05em 0.05em 0 var(--blue-dark);
        transform: translateZ(0);
        transform-style: preserve-3d;
        will-change: transform;
        transition: transform 220ms cubic-bezier(0.2, 1.4, 0.4, 1), border-color 180ms ease;
      }

      .media-slot:hover {
        z-index: 5;
        border-color: var(--acid);
      }

      .video-slot {
        padding: 0;
        cursor: pointer;
      }

      .video-slot video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.88;
      }

      .video-slot::after {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-top: 0.13em solid transparent;
        border-bottom: 0.13em solid transparent;
        border-left: 0.19em solid var(--acid);
        content: "";
        transform: translate(-35%, -50%);
      }

      .video-slot.is-playing::after {
        width: 0.12em;
        height: 0.25em;
        border: 0;
        border-right: 0.05em solid var(--acid);
        border-left: 0.05em solid var(--acid);
        transform: translate(-50%, -50%);
      }

      .photo-slot {
        background:
          radial-gradient(circle at 24% 30%, var(--acid) 0 9%, transparent 10%),
          linear-gradient(135deg, #eff2ff 0 22%, #77a2ff 22% 53%, #f8b9d8 53% 76%, #ff7b3d 76%);
      }

      .photo-slot::before,
      .photo-slot::after {
        position: absolute;
        background: rgba(20, 39, 180, 0.75);
        content: "";
      }

      .photo-slot::before {
        right: 11%;
        bottom: 12%;
        width: 42%;
        height: 42%;
        border-radius: 50%;
      }

      .photo-slot::after {
        bottom: 0;
        left: 0;
        width: 100%;
        height: 25%;
      }

      .signal-slot {
        background:
          linear-gradient(120deg, transparent 20%, rgba(204, 255, 61, 0.9) 21% 24%, transparent 25% 49%, rgba(248, 248, 243, 0.95) 50% 54%, transparent 55%),
          repeating-linear-gradient(0deg, rgba(248, 248, 243, 0.12) 0 1px, transparent 1px 0.09em),
          var(--blue-dark);
        animation: signal-shift 3.2s steps(4, end) infinite;
      }

      @keyframes signal-shift {
        50% {
          background-position: 0.15em 0, 0.2em 0, 0;
        }
      }

      @media (max-width: 760px) {
        body {
          cursor: auto;
        }

        .cursor-orb {
          display: none;
        }

        .shell {
          width: min(calc(100% - 1.25rem), 96rem);
        }

        .menu-links .menu-item:nth-child(2) {
          display: none;
        }

      .title-lockup {
          width: 100%;
          position: relative;
          top: auto;
          left: auto;
          margin: 7rem auto 0;
          font-size: clamp(2.5rem, 11vw, 5rem);
          letter-spacing: -0.085em;
          transform: none;
        }

        .pain-pops {
          position: relative;
          inset: auto;
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 0.5rem;
          padding-top: 5rem;
        }

        .pain-pop {
          position: static;
          max-width: none;
          opacity: 1;
          transform: none;
        }

        .dev-badge {
          right: 0;
          bottom: 1.5rem;
        }

        .title-row {
          justify-content: flex-start;
          white-space: normal;
        }

        .media-slot {
          width: 1.35em;
          height: 0.58em;
          border-width: 1px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .signal-slot {
          animation: none;
        }

      }
    </style>
  </head>
  <body>
    <div class="cursor-orb" aria-hidden="true"></div>

    <main>
      <section class="hero" aria-label="People spend five hours a year finding directories">
        <div class="shell">
          <nav class="menu" aria-label="Showcase navigation">
            <a class="menu-brand" href="#top">WTFIS</a>
            <div class="menu-links">
              <a class="menu-item" href="#title">01 / pain point</a>
              <button class="menu-item" id="play-all" type="button">play media</button>
              <a class="menu-item" href="#title">next</a>
            </div>
          </nav>

          <div class="pain-pops" aria-label="Common project search pain points">
            <div class="pain-pop pop-one">Without starting a project?</div>
            <div class="pain-pop pop-two">Opening a bunch of windows?</div>
            <div class="pain-pop pop-three">Copy-pasting paths?</div>
            <div class="pain-pop pop-four">Searching the same folders again?</div>
          </div>

          <div class="dev-badge">0.01% of devs do this</div>

          <h1 class="title-lockup" id="title">
            <span class="title-row">
              <span class="word" data-emoji="📁">People</span>
              <span class="word" data-emoji="⏳">Spend</span>
            </span>
            <span class="title-row">
              <span class="word" data-emoji="⌛">5</span>
              <span class="word" data-emoji="🕰️">hours</span>
              <button class="media-slot video-slot" id="video-slot" type="button" aria-label="Play pain point video">
                <video id="video" muted playsinline></video>
              </button>
              <span class="word" data-emoji="🗓️">a Year</span>
            </span>
            <span class="title-row">
              <span class="word" data-emoji="🔎">Finding</span>
              <button class="media-slot photo-slot" type="button" aria-label="Pain point image placeholder"></button>
              <span class="word" data-emoji="💻">Directories</span>
            </span>
          </h1>

        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
    <script>
      const cursor = document.querySelector(".cursor-orb");
      const words = [...document.querySelectorAll(".word")];
      const mediaSlots = [...document.querySelectorAll(".media-slot")];
      const videoSlot = document.querySelector("#video-slot");
      const video = document.querySelector("#video");
      const playAll = document.querySelector("#play-all");

      const canvas = document.createElement("canvas");
      canvas.width = 480;
      canvas.height = 480;
      const context = canvas.getContext("2d");
      const stream = canvas.captureStream ? canvas.captureStream(24) : null;
      if (stream) video.srcObject = stream;

      function drawVideo(time) {
        const pulse = Math.sin(time / 180) * 12;
        context.fillStyle = "#1427b4";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.strokeStyle = "rgba(248,248,243,.18)";
        context.lineWidth = 2;
        for (let i = 0; i < canvas.width; i += 48) {
          context.beginPath();
          context.moveTo(i, 0);
          context.lineTo(i, canvas.height);
          context.stroke();
          context.beginPath();
          context.moveTo(0, i);
          context.lineTo(canvas.width, i);
          context.stroke();
        }
        context.fillStyle = "#caff39";
        context.font = "600 24px IBM Plex Mono, monospace";
        context.fillText("$ cd ~/GSpace", 28, 62);
        context.fillStyle = "#fafaf5";
        context.fillText("cd: not found", 28, 112);
        context.fillStyle = "rgba(250,250,245,.78)";
        context.fillText("$ wtfis", 28, 190);
        context.fillStyle = "#caff39";
        context.fillRect(28, 235, 190 + pulse, 4);
        context.fillStyle = "#fafaf5";
        context.fillText("finding project...", 28, 300);
        context.fillStyle = "rgba(250,250,245,.55)";
        context.fillText("the folder was there", 28, 370);
        requestAnimationFrame(drawVideo);
      }

      requestAnimationFrame(drawVideo);

      function playVideo() {
        videoSlot.classList.add("is-playing");
        video.play().catch(() => {});
      }

      function pauseVideo() {
        videoSlot.classList.remove("is-playing");
        video.pause();
      }

      videoSlot.addEventListener("click", () => {
        if (video.paused) playVideo();
        else pauseVideo();
      });

      playAll.addEventListener("click", () => {
        const shouldPlay = video.paused;
        if (shouldPlay) playVideo();
        else pauseVideo();
      });

      const observer = new IntersectionObserver(
        ([entry]) => {
          if (entry.isIntersecting) playVideo();
          else pauseVideo();
        },
        { threshold: 0.35 },
      );
      observer.observe(videoSlot);

      window.addEventListener("pointermove", (event) => {
        if (cursor) {
          gsap.to(cursor, { x: event.clientX, y: event.clientY, duration: 0.22, ease: "power2.out" });
        }

        words.forEach((word) => {
          const rect = word.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const distance = Math.hypot(event.clientX - centerX, event.clientY - centerY);
          const influence = Math.max(0, 1 - distance / 190);
          gsap.to(word, {
            x: (event.clientX - centerX) * influence * 0.1,
            y: (event.clientY - centerY) * influence * 0.08,
            rotate: (event.clientX - centerX) * influence * 0.018,
            duration: 0.34,
            overwrite: true,
            ease: "power3.out",
          });
        });

        mediaSlots.forEach((slot) => {
          const rect = slot.getBoundingClientRect();
          const rotateY = Math.max(-2.5, Math.min(2.5, ((event.clientX - (rect.left + rect.width / 2)) / rect.width) * 2.5));
          const rotateX = Math.max(-2.5, Math.min(2.5, ((event.clientY - (rect.top + rect.height / 2)) / rect.height) * -2.5));
          gsap.to(slot, {
            rotateX,
            rotateY,
            duration: 0.55,
            overwrite: true,
            ease: "power2.out",
          });
        });

      });

      document.querySelectorAll("button, a, .word").forEach((element) => {
        element.addEventListener("mouseenter", () => cursor?.classList.add("is-hovering"));
        element.addEventListener("mouseleave", () => cursor?.classList.remove("is-hovering"));
      });

      if (window.gsap && window.ScrollTrigger) {
        gsap.registerPlugin(ScrollTrigger);
        const entrance = gsap.timeline({ defaults: { ease: "power4.out" } });
        entrance
          .from(".menu", { y: -20, opacity: 0, duration: 0.65 })
          .from(".title-row", { y: 100, opacity: 0, stagger: 0.12, duration: 0.9 }, "-=0.25")
          .from(".media-slot", { scale: 0.4, rotate: -12, stagger: 0.1, duration: 0.8 }, "-=0.7")
          .from(".pop-one, .pop-three", { x: -180, opacity: 0, scale: 0.92, stagger: 0.14, duration: 0.65 }, "-=0.3")
          .from(".pop-two, .pop-four", { x: 180, opacity: 0, scale: 0.92, stagger: 0.14, duration: 0.65 }, "<")
          .from(".dev-badge", { y: 12, scale: 0.8, opacity: 0, duration: 0.55 }, "-=0.2");

        gsap.to(".title-lockup", {
          y: -42,
          scrollTrigger: {
            trigger: ".hero",
            start: "top top",
            end: "bottom top",
            scrub: 1,
          },
        });
      }
    </script>
  </body>
</html>
